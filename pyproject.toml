[project]
name = "ai-engineering-labs"
version = "0.1.0"
description = "My course workspace for AI Engineering"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai>=3.55",
    "requests>=2.32",
    "tiktoken>=0.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.course]
# The platform fills this in when it creates the template. tools/doctor.py
# checks that OPENAI_BASE_URL points here.
gateway_host = "gateway.keelacademy.com"
